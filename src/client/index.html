<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LOAD "MANASSES",8,1</title>
    <meta
      name="description"
      content="Die Bewerbung von Manassés Zähnler als Fullstack Developer bei der Software Brauerei AG: ein C64, auf dem du eine ehrliche KI-Version von ihm interviewst."
    />
    <meta name="theme-color" content="#6c5eb5" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content='LOAD "MANASSES",8,1' />
    <meta
      property="og:description"
      content="Eine Bewerbung als C64. Interview mit einer KI, die nicht lügen darf."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="frame" id="frame">
      <main class="screen" id="screen" aria-labelledby="page-title">
        <h1 id="page-title" class="sr-only">
          LOAD MANASSES: Bewerbung von Manassés Zähnler als Fullstack Developer bei der Software
          Brauerei AG
        </h1>
        <div id="output" class="output" role="log" aria-live="off" aria-label="Bildschirmausgabe"></div>
        <form id="prompt" class="prompt" autocomplete="off" hidden>
          <label class="sr-only" for="command">Frage oder Befehl eingeben, Enter zum Senden</label>
          <label class="sr-only" for="secret">Zugangscode eingeben</label>
          <div class="prompt__field">
            <div class="prompt__mirror" aria-hidden="true"><span id="cursor-before"></span><span id="cursor" class="cursor"> </span><span id="cursor-after"></span></div>
            <textarea
              id="command"
              class="prompt__input"
              rows="1"
              maxlength="500"
              spellcheck="false"
              autocapitalize="sentences"
              enterkeyhint="send"
            ></textarea>
            <input
              id="secret"
              class="prompt__input"
              type="password"
              autocomplete="off"
              enterkeyhint="go"
              hidden
            />
          </div>
        </form>
      </main>
      <nav id="suggestions" class="suggestions" aria-label="Vorschläge" hidden></nav>
    </div>
    <button id="skip" class="chip skip" type="button" hidden>Boot überspringen</button>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <p class="noscript">?JAVASCRIPT NOT PRESENT ERROR<br />Ohne JavaScript bootet dieser C64 leider nicht.</p>
    </noscript>
  </body>
</html>
